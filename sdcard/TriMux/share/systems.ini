# Launcher scripts (.sh) for native ports, e.g. installed by PortMaster.
# Only the top level of the folder is listed (port data lives in sub-folders).
[PORTS]
name = Ports
short = PORT
folders = PORTS
extensions = sh
emulators = shell, portmaster
max_depth = 1
; ports of the stock TrimUI firmware: one folder per game with config.json + launch.sh,
; in Roms/PORTS or in the stock Ports folder at the card root
app_folders = 1
root_folder = Ports
experimental = 1
note = sys.ports.note
color = 2e7d32
