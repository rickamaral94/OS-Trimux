# TriMux platforms. Edit to add folders/extensions; no code change needed.
#
#   folders     names searched inside Roms/ (case-insensitive). The first one is
#               created by "Criar pastas padrão". A folder named "Anything (TAG)"
#               also matches when TAG is listed here (MinUI/NextUI cards).
#   extensions  accepted file extensions
#   emulators   ids from emulators.ini; the first available is the default
#   bios        files expected in /Bios (informational; never shipped)
#   color       badge colour (RRGGBB)
#
# Folder names follow the stock TrimUI card (FC, SFC, GB, GBA, MD, MS, PCE, PS,
# ARCADE, NEOGEO) so an existing stock card is found without moving files.

# thumbs: libretro-thumbnails repositories used by "Baixar capas" (first that
# has the image wins; several separated by |). Without it, no covers.

[FC]
name = Nintendo (NES / Famicom)
short = NES
folders = FC, NES, famicom, FDS
thumbs = Nintendo - Nintendo Entertainment System
extensions = nes, unf, unif, fds, zip, 7z
emulators = fceumm, nestopia
bios = disksys.rom
color = c0392b

