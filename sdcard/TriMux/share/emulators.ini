# Ports: runs the .sh launcher with the firmware's shell.
[shell]
name = Script do port
type = script
config_name = Ports
profile = balanced
experimental = 1
note = emu.shell.note

# PortMaster (installed on request from Aplicativos › Loja): runs the PC
# ports it installs into Roms/PORTS, and its own "Portmaster" entry.
[portmaster]
name = PortMaster
type = portmaster
config_name = PortMaster
profile = performance
experimental = 1
note = emu.portmaster.note
