# TriMux emulators (RetroArch cores built by scripts/build_cores.sh).
#
#   core         file in TriMux/retroarch/cores
#   config_name  RetroArch core name, used for TriMuxData/retroarch/config/<name>
#                ("Restaurar configuração recomendada" archives that folder)
#   profile      power profile used when the global setting is "Automático":
#                economy | balanced | performance (all capped at 1.8 GHz)
#   note         i18n key with a short explanation shown in the menu

[fceumm]
name = FCEUmm
core = fceumm_libretro.so
config_name = FCEUmm
profile = economy
note = emu.fceumm.note

