# TriMux app store: community apps TriMux downloads on request (nothing here
# ships inside the TriMux image). Each entry is pinned to a release and its
# SHA-256; see src/core/store.h for the keys. dest/remove/touch may only point
# to Apps/, Emus/ or Roms/PORTS/ on the card.

[portmaster]
name = PortMaster
desc = store.portmaster.desc
version = 2.14.0
url = https://github.com/ben16w/minui-portmaster/releases/download/2.14.0/PORTS.pak.zip
sha256 = 969ca07385b40b72c230143e474fb393ce28c1d550ce311db8c97580aa020252
size = 148938743
license = MIT (bundles third-party programs under their own licenses)
source = https://github.com/ben16w/minui-portmaster
dest = Emus/tg5040/PORTS.pak
installed = launch.sh
keep = PortMaster
remove = Emus/tg5040/PORTS.pak|Roms/PORTS/Portmaster.sh
touch = Roms/PORTS/Portmaster.sh
system = 1

[grout]
name = Grout
desc = store.grout.desc
version = 5.3.1.2
url = https://github.com/rommapp/grout/releases/download/v5.3.1.2/Grout-Trimui.zip
sha256 = dd08d536635fd77462500f260272a5856b625782c29513e831ed283225ddcc37
size = 24429190
license = MIT
source = https://github.com/rommapp/grout
dest = Apps
installed = Grout/launch.sh
remove = Apps/Grout
system = 0
