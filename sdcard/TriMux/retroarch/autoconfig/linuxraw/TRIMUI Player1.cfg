# TrimUI Brick Pro built-in controller as exposed by the firmware's
# trimui_inputd (uinput device "TRIMUI Player1", read through /dev/input/js*).
# Button/axis numbers follow community documentation for the TG5040-family
# pad and still need confirmation on a Brick Pro: use TriMux
# "Configurações > Controles > Testar controles" to see the raw numbers.
input_driver = "linuxraw"
input_device = "TRIMUI Player1"
input_device_display_name = "TrimUI Brick Pro"

input_b_btn = "0"
input_a_btn = "1"
input_y_btn = "2"
input_x_btn = "3"
input_l_btn = "4"
input_r_btn = "5"
input_select_btn = "6"
input_start_btn = "7"
input_l3_btn = "9"
input_r3_btn = "10"
input_l2_axis = "+2"
input_r2_axis = "+5"

input_up_axis = "-7"
input_down_axis = "+7"
input_left_axis = "-6"
input_right_axis = "+6"

input_l_x_plus_axis = "+0"
input_l_x_minus_axis = "-0"
input_l_y_plus_axis = "+1"
input_l_y_minus_axis = "-1"
input_r_x_plus_axis = "+3"
input_r_x_minus_axis = "-3"
input_r_y_plus_axis = "+4"
input_r_y_minus_axis = "-4"

input_menu_toggle_btn = "15"
