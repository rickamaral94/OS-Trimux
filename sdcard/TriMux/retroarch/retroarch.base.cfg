# TriMux RetroArch defaults for the TrimUI Brick Pro (1024x768, 60 Hz).
# Copied once to TriMuxData/retroarch/retroarch.cfg; your changes there are
# kept across TriMux updates. Directories are set per launch by trimuxctl
# (saves in /Saves/<PLATAFORMA>, states in /States/<PLATAFORMA>, BIOS in /Bios).
# "~" is TriMuxData/retroarch, ":" is TriMux/retroarch.

# --- video: GLES through the firmware's SDL2 (PowerVR GE8300) ---------------
video_driver = "gl"
video_fullscreen = "true"
video_windowed_fullscreen = "true"
video_vsync = "true"
video_hard_sync = "false"
video_threaded = "false"
video_max_swapchain_images = "3"
video_smooth = "false"
video_scale_integer = "false"
aspect_ratio_index = "22"
video_shader_enable = "false"
video_font_enable = "true"
video_font_size = "26.000000"
video_gpu_screenshot = "false"

# --- audio --------------------------------------------------------------
audio_driver = "alsa"
audio_enable = "true"
audio_sync = "true"
audio_latency = "64"
audio_out_rate = "48000"
audio_resampler = "sinc"
audio_resampler_quality = "1"

# --- input: firmware gamepad "TRIMUI Player1" via /dev/input/js* ----------
input_driver = "sdl2"
input_joypad_driver = "linuxraw"
input_autodetect_enable = "true"
joypad_autoconfig_dir = ":/autoconfig"
input_max_users = "1"
# Hotkeys. MENU is the hotkey key; it is not used by retro games.
input_enable_hotkey_btn = "8"
input_menu_toggle_btn = "15"
input_menu_toggle_gamepad_combo = "2"
input_exit_emulator_btn = "7"
input_save_state_btn = "5"
input_load_state_btn = "4"
input_state_slot_increase_axis = "+5"
input_state_slot_decrease_axis = "+2"
input_toggle_fast_forward_btn = "3"
input_hotkey_block_delay = "5"
quit_press_twice = "false"
fastforward_ratio = "3.000000"

# --- menu -----------------------------------------------------------------
menu_driver = "rgui"
rgui_menu_color_theme = "4"
rgui_show_start_screen = "false"
menu_show_core_updater = "false"
menu_show_online_updater = "false"
menu_show_load_core = "false"
menu_show_load_content = "false"
menu_show_quit_retroarch = "true"
menu_pause_libretro = "true"
pause_nonactive = "false"
menu_swap_ok_cancel_buttons = "false"

# --- files: write only when the user asks ---------------------------------
config_save_on_exit = "false"
savestate_auto_save = "false"
savestate_auto_load = "false"
savestate_thumbnail_enable = "false"
sort_savefiles_enable = "false"
sort_savestates_enable = "false"
sort_savefiles_by_content_enable = "false"
sort_savestates_by_content_enable = "false"
autosave_interval = "0"
block_sram_overwrite = "false"
rgui_config_directory = "~/config"
input_remapping_directory = "~/remaps"
global_core_options = "false"
game_specific_options = "true"
cache_directory = "/tmp/trimux/cache"
content_history_size = "0"
history_list_enable = "false"
log_to_file = "false"
log_verbosity = "false"

# --- performance: keep CPU/RAM headroom on a 1 GB device -------------------
rewind_enable = "false"
run_ahead_enabled = "false"
preemptive_frames_enable = "false"
video_frame_delay = "0"
core_info_cache_enable = "true"

# RetroAchievements: off unless enabled in TriMux (Settings > Network); the
# account is passed per game in the RAM append config, never stored here.
cheevos_enable = "false"
cheevos_hardcore_mode_enable = "false"
cheevos_badges_enable = "false"
cheevos_auto_screenshot = "false"
# No remote control or LAN discovery services.
network_cmd_enable = "false"
netplay_public_announce = "false"
