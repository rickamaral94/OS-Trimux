name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a pre-release with this tag (e.g. v0.1.0); empty = build only"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  host-tests:
    name: Unit, script and UI tests (host)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsdl2-dev fonts-dejavu-core dosfstools mtools shellcheck python3-pytest
      - name: Unit tests (ASan/UBSan) and native builds
        run: make test-unit native ui-native
      - name: Python tests (scripts, catalog, i18n, image, UI offscreen)
        run: python3 -m pytest -q tests/py

  image:
    name: Cross build, smoke test and card image
    runs-on: ubuntu-24.04
    needs: host-tests
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (Debian bullseye snapshot, pinned)
        run: make toolchain
      - name: Sources (pinned commits)
        run: make sources
      - name: Official firmware (pinned SHA-256, for ABI smoke tests only)
        run: make firmware
      - name: Build, test, smoke test, image
        run: make all-docker
      - name: Checksums
        run: cat build/out/*.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: trimux-image
          path: |
            build/out/*.img.xz
            build/out/*-update.zip
            build/out/*.sha256
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-and-logs
          path: |
            build/smoke/*.txt
            build/smoke/*.log
            build/logs/
          retention-days: 30

  release:
    name: Publish release
    # a pushed v* tag, or a manual run on main with a release_tag (GitHub
    # then creates the tag on the exact commit that was built and tested)
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
       startsWith(inputs.release_tag, 'v'))
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: trimux-image
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}
        run: |
          case "$TAG" in v[0-9]*) ;; *) echo "invalid tag: $TAG" >&2; exit 1 ;; esac
          # The notes link to other docs relatively (docs/X.md). On the release
          # page those must be absolute links to the commit that was built.
          base="https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/docs"
          sed -E "s#\]\(([A-Za-z0-9_./-]+\.md)\)#](${base}/\1)#g" docs/NOTAS_DE_VERSAO.md > notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            # re-running an existing release only refreshes its notes; the
            # files stay the ones built from the tagged commit
            gh release edit "$TAG" --title "TriMux $TAG" --notes-file notes.md --prerelease
          else
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "TriMux $TAG" \
              --notes-file notes.md --prerelease
          fi
